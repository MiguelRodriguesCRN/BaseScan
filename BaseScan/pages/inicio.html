<!-- inicio.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Escolha de Análise</title>
  <link rel="stylesheet" href="styles/tela-inicio.css">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Alumni+Sans+SC:ital,wght@0,100..900;1,100..900&family=Fira+Sans:wght@400;600&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sofia+Sans+Semi+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap');
  </style>
</head>

<body>
  <div class="dashboard-container">
    
    <!-- Sidebar lateral -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-toggle" id="toggleSidebar" onclick="toggleSidebar()">☰</div>

      <ul>
        <li onclick="navegar('aulas')">
          <span class="icon">📂</span>
          <span class="link-text">Aulas Presas</span>
        </li>
       <!-- <li onclick="navegar('logs')">
          <span class="icon">📄</span>
          <span class="link-text">Logs de Exame</span>
        </li>-->
       <!-- <li onclick="navegar('desligamento')">
          <span class="icon">⏱</span>
          <span class="link-text">Desligamento</span> -->
        
        <li onclick="navegar('salto')">
          <span class="icon">📴</span>
          <span class="link-text">Desligamento</span>
        </li>
      </ul>

    </aside>

    <!-- Conteúdo principal -->
    <main class="content">
      <header>
        <h1 class="titulo">Dashboard</h1>
        <p class="subtitulo">Escolha uma das opções para realizar a análise</p>
      </header>

      <section class="cards">
        <div id="superPratico" class="card" onclick="navegar('aulas')">
          <h2>Aulas Presas</h2>
          <p>Analisa ocorrências de aulas que não finalizaram corretamente no sistema.</p>
        </div>

       <!-- <div id="exameTeorico" class="card" onclick="navegar('logs')">
          <h2>Logs de Exame</h2>
          <p>Visualize os logs de execução e compare registros para identificar falhas.</p>
        </div>-->
        <!-- <div id="superPratico" class="card" onclick="navegar('desligamento')">
          <h2>Desligamento</h2>
          <p>Verifica problemas de desligamento abrupto e falhas de energia durante sessões.</p>
        </div> -->

        <div id="superPratico" class="card" onclick="navegar('salto')">
          <h2>Salto de Desligamento</h2>
          <p>Verifica saltos de desligamento durante a aula atraves de uma analise da base.</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const toggleSidebarBtn = document.getElementById('toggleSidebar');
    const sidebar = document.querySelector('.sidebar');
    
    function navegar(tipo) {
      window.electronAPI.abrirTela(tipo);
    }

    toggleSidebarBtn.addEventListener('click', () => {
    sidebar.classList.toggle('expanded');
    });
  </script>

  <!-- Bootstrap JS Bundle via CDN (inclui Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
